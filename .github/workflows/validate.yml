name: Kit Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Flow 5.2.0 contracts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout Research Kit
        uses: actions/checkout@v4
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install pinned validation tooling
        run: pnpm install --frozen-lockfile
      - name: Validate container and all definitions
        run: npm run validate
      - name: Isolated local kit install and structural inspection
        run: npm run validate:install
